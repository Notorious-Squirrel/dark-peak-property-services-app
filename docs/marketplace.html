<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One List | Find a business</title><style>*{box-sizing:border-box}body{margin:0;background:#171a1d;color:white;font:16px Arial,sans-serif}header{background:#292e31;border-bottom:3px solid #f28c28;padding:20px}main{max-width:960px;margin:auto;padding:20px}h1{margin-bottom:5px}p{color:#c4c8ca;line-height:1.5}.tag{color:#f28c28;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.card{background:#292e31;border:1px solid #444;border-radius:12px;padding:20px}.card h2{margin-top:0}input{width:100%;background:#24282b;color:white;padding:14px;border:1px solid #777;border-radius:8px;margin:12px 0 22px}a{color:#f28c28}.btn{display:inline-block;background:#f28c28;color:#171a1d;padding:12px 16px;border-radius:8px;font-weight:bold;text-decoration:none}small{color:#c4c8ca}</style></head><body><header><strong style="font-size:25px">ONE LIST</strong><div class="tag">One list. One visit. Job done.</div></header><main><a href="./">← Back to services</a><h1>Find a business</h1><p>Explore local trades and property services. Browse business profiles, services and indicative prices.</p><label for="search">Search businesses or areas</label><input id="search" placeholder="e.g. joinery, Glossop or Manchester" autocomplete="off"><div id="results" class="cards"><p>Loading businesses…</p></div><p><small>Business information is supplied by each provider and is not independently verified by One List.</small></p></main><script>
const BASE='https://frlmgnaavsejisqngavk.supabase.co',KEY='sb_publishable_C2fEWLJF9k4CJoIyXcyvXQ_oGJsjAWK';let businesses=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=document.getElementById('search').value.trim().toLowerCase();const filtered=businesses.filter(x=>[x.company_name,x.bio,x.service_area].join(' ').toLowerCase().includes(q));document.getElementById('results').innerHTML=filtered.length?filtered.map(x=>'<article class="card"><h2>'+esc(x.company_name)+'</h2><p>'+esc(x.service_area||'Service area not supplied')+'</p><p>'+esc((x.bio||'').slice(0,230))+'</p><a class="btn" href="./?business='+encodeURIComponent(x.slug)+'">View services and profile</a></article>').join(''):'<p>No businesses match your search yet.</p>'}document.getElementById('search').addEventListener('input',render);(async()=>{try{const r=await fetch(BASE+'/rest/v1/businesses?select=slug,company_name,bio,service_area&published=eq.true&order=company_name.asc',{headers:{apikey:KEY},cache:'no-store'});if(!r.ok)throw Error('Marketplace database not yet configured');businesses=await r.json();render()}catch(e){document.getElementById('results').textContent='Marketplace is being prepared. Please check back soon.'}})();
</script></body></html>
